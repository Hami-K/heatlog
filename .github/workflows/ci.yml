name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Debug symbols are most of a Windows target directory, and the runner
  # has run out of disk building this tree twice over for clippy and test.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
