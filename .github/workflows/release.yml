name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      # Notes are written when the release is created; this only attaches
      # the built binary.
      - uses: softprops/action-gh-release@v2
        with:
          files: target/release/heatlog.exe
