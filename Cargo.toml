[package]
name = "heatlog"
version = "0.3.0"
edition = "2021"
description = "Records hardware stats while you game and reports throttling afterwards"
repository = "https://github.com/Hami-K/heatlog"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
eframe = "0.29"
egui-phosphor = "0.7"
egui_plot = "0.29"
nvml-wrapper = "0.11"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.33"
toml = "0.8"
trash = "5"
ureq = "2"
windows = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Memory", "Win32_UI_Shell", "Wdk_Graphics_Direct3D"] }
wmi = "0.14"
