[package]
name = "heatlog"
version = "0.1.0"
edition = "2021"
description = "Records hardware stats while you game and reports throttling afterwards"
repository = "https://github.com/Hami-K/heatlog"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
nvml-wrapper = "0.11"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
toml = "0.8"
wmi = "0.14"
